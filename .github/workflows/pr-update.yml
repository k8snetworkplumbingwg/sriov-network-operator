name: "Run Jobs on PR"
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Runs from the base context; never check out or execute pull request head code.

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  execute:
    name: "remove the lgtm label"
    runs-on: ubuntu-24.04
    steps:
      - uses: cncf/prow-github-actions@ed3bb424a5475f42b5d699048faa4a469a68b9ef # v3.4.0
        with:
          jobs: 'lgtm'
          github-token: "${{ secrets.GITHUB_TOKEN }}"
