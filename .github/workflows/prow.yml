name: "Prow github actions"
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - uses: cncf/prow-github-actions@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
        with:
          prow-commands: '/assign
            /unassign
            /approve
            /retitle
            /area
            /kind
            /priority
            /remove
            /lgtm
            /close
            /reopen
            /lock
            /milestone
            /hold
            /cc
            /uncc'
          github-token: "${{ secrets.GITHUB_TOKEN }}"
